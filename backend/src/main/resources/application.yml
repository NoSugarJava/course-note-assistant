server:
  port: 8080

spring:
  application:
    name: course-note-assistant

  datasource:
    url: jdbc:h2:file:./data/h2/noteassistant;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 420MB

app:
  storage:
    upload-dir: data/uploads
    note-dir: data/notes
  ocr:
    max-image-count: 20
    max-image-size: 20971520
